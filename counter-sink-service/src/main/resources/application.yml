spring:
  application:
    name: counter-sink-service
  main:
    banner-mode: off
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
logging:
  structured.format.console: logstash
server:
  port: 8080
spring.datasource:
  url: ${JDBC_URL:jdbc:postgresql://localhost:5432/video}
  username: ${POSTGRES_USER:video}
  password: ${POSTGRES_PASSWORD:video}
  hikari.maximum-pool-size: 8
spring.data.redis:
  host: ${REDIS_HOST:localhost}
  timeout: 2s
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    enable-auto-commit: false
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    properties:
      isolation.level: read_committed
      max.poll.records: 50
  producer:
    acks: all
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    properties.enable.idempotence: true
  listener:
    ack-mode: record
    concurrency: 2
counter.projection:
  topic: ${COUNTER_CDC_TOPIC:counter-cdc.public.video_counter}
  consumer-group: ${COUNTER_CDC_CONSUMER_GROUP:counter-cache-projector-v1}
  key-prefix: ${COUNTER_REDIS_KEY_PREFIX:video:}
  marker-key: ${COUNTER_REDIS_MARKER_KEY:counter-projection:generation}
  signaling-table: ${COUNTER_CDC_SIGNALING_TABLE:public.debezium_signal}
  counter-table: ${COUNTER_CDC_COUNTER_TABLE:public.video_counter}
  rebuild-enabled: ${COUNTER_CDC_REBUILD_ENABLED:true}
  recovery-interval-ms: ${COUNTER_CDC_RECOVERY_INTERVAL_MS:5000}
  retry-interval-ms: ${COUNTER_CDC_RETRY_INTERVAL_MS:2000}
