name: distributed-video-counter
x-app: &app
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 15
    start_period: 60s
x-environment: &environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  POSTGRES_USER: video
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video-local-password}
  JDBC_URL: jdbc:postgresql://postgres:5432/video
  R2DBC_URL: r2dbc:postgresql://postgres:5432/video
  REDIS_HOST: redis
  COUNTER_SHARD_COUNT: ${COUNTER_SHARD_COUNT:-128}
services:
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:9092:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
  topics:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    environment:
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-24}
      KAFKA_REPLICATION_FACTOR: 1
    volumes: ["./infrastructure/kafka:/scripts:ro"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: video
      POSTGRES_USER: video
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video-local-password}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  counter-sink-service:
    <<: *app
    image: video-counter/counter-sink-service:local
    build: {context: ., args: {MODULE: counter-sink-service}}
    environment: *environment
    depends_on:
      topics: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  counter-stream-service:
    <<: *app
    image: video-counter/counter-stream-service:local
    build: {context: ., args: {MODULE: counter-stream-service}}
    environment:
      <<: *environment
      STREAMS_APPLICATION_ID: video-counter-v1
      STANDBY_REPLICAS: 0
    depends_on:
      topics: {condition: service_completed_successfully}
  view-service:
    <<: *app
    image: video-counter/view-service:local
    build: {context: ., args: {MODULE: view-service}}
    environment:
      <<: *environment
      HMAC_SECRET: ${HMAC_SECRET:-local-demo-only-secret-change-before-deploying}
    depends_on:
      counter-sink-service: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
  api-gateway:
    <<: *app
    image: video-counter/api-gateway:local
    build: {context: ., args: {MODULE: api-gateway}}
    ports: ["8080:8080"]
    environment:
      VIEW_SERVICE_URL: http://view-service:8080
    depends_on:
      view-service: {condition: service_healthy}
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
volumes:
  kafka-data:
  postgres-data:
